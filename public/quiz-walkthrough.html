t simple strength and protein notes.`},{id:`q1_b`,letter:`C`,label:`I have been in treatment for three to six months.`,insight:`This is a useful time to notice changes in strength, food intake, comfort and routine.`},{id:`q1_f`,letter:`D`,label:`I have been in treatment for six to twelve months.`,insight:`Use your routine and strength records to review progress with your clinician.`},{id:`q1_g`,letter:`E`,label:`I have been in treatment for more than a year.`,insight:`Review what is sustainable and what has changed in your usual routine.`},{id:`q1_not_started`,letter:`F`,label:`I have not started GLP-1 treatment.`,insight:`You can build strength and nutrition habits before any treatment decision.`},{id:`q1_c`,letter:`G`,label:`I recently stopped treatment.`,insight:`A change in treatment deserves follow up with your current clinician. This summary can help organize your questions.`},{id:`q1_d`,letter:`H`,label:`I am not sure of my timeline or dose schedule.`,insight:`That is fine for this quiz. Confirm the details with your current clinician when you can.`}]},q2:{id:`q2`,type:`question`,topic:`Current priorities`,prompt:`What would you most like to understand or support right now?`,hint:`Choose every answer that fits.`,multi:!0,options:[{id:`a`,letter:`A`,label:`Changes in strength, muscle tone or everyday function`,insight:`We will include strength and lean tissue in your summary.`},{id:`b`,letter:`B`,label:`Low energy, trouble concentrating or slower recovery`,insight:`We will include energy and recovery in your summary.`},{id:`c`,letter:`C`,label:`Nausea, bloating or digestive discomfort`,insight:`We will include digestive comfort in your summary.`},{id:`d`,letter:`D`,label:`Keeping my progress and building a maintenance routine`,insight:`Maintenance is part of long term care, not a test of willpower.`}]},q3:{id:`q3`,type:`question`,topic:`Strength and function`,prompt:`Have everyday strength tasks felt different since your weight began to change?`,hint:`Think about stairs, groceries, getting up from a chair or your usual workout.`,options:[{id:`q3_a`,letter:`A`,label:`No. My strength and daily function feel steady.`,insight:`That is useful to record. Function can add context that a scale or body scan cannot.`},{id:`q3_b`,letter:`B`,label:`I feel stronger or have more endurance.`,insight:`That progress matters. Strength and function deserve to be tracked alongside weight.`},{id:`q3_c`,letter:`C`,label:`I have not paid much attention to strength or function.`,insight:`A few repeatable tasks can give you a more useful baseline than appearance alone.`},{id:`q3_d`,letter:`D`,label:`Yes. Some everyday tasks or workouts feel harder.`,insight:`A change in function is worth discussing with your current clinician, especially if it is new or getting worse.`}]},q4:{id:`q4`,type:`question`,topic:`Energy`,prompt:`How has your energy felt during a typical day?`,hint:`Consider timing, sleep, food, fluids and whether the pattern is new.`,options:[{id:`q4_a`,letter:`A`,label:`I often feel drained, and rest does not fully help.`,insight:`Persistent fatigue can have many causes. Record the pattern and discuss it with your current clinician.`},{id:`q4_b`,letter:`B`,label:`My energy feels steady most days.`,insight:`That is a helpful baseline to keep in your continuity record.`},{id:`q4_c`,letter:`C`,label:`I have mild dips that improve with food, fluids, rest or movement.`,insight:`Timing and what helps can make your notes more useful.`},{id:`q4_d`,letter:`D`,label:`I have plenty of energy but have trouble winding down.`,insight:`Sleep and energy patterns can overlap. Bring new or disruptive changes to your current clinician.`}]},q5:{id:`q5`,type:`question`,topic:`Digestive comfort`,prompt:`How often do meals leave you uncomfortably full, bloated or nauseated?`,hint:`Think about frequency, meal size, timing and how long the feeling lasts.`,options:[{id:`q5_a`,letter:`A`,label:`Rarely or never.`,insight:`We will record that digestive comfort is not a main concern right now.`},{id:`q5_b`,letter:`B`,label:`Only after certain foods or unusually large meals.`,insight:`Specific triggers and portion size are useful details to note.`},{id:`q5_c`,letter:`C`,label:`Regularly. Discomfort can last well after I eat.`,insight:`Ongoing symptoms deserve clinical guidance. Your summary can help you describe the pattern clearly.`},{id:`q5_d`,letter:`D`,label:`Occasionally, and it resolves quickly.`,insight:`Record what happened before the symptom and what helped.`}]},q6:{id:`q6`,type:`question`,topic:`Strength priority`,prompt:`What would make your body composition progress feel more complete?`,hint:`Choose the result that matters most to you.`,options:[{id:`q6_a`,letter:`A`,label:`Seeing the scale move as quickly as possible.`,insight:`Speed alone does not show what tissue changed or how your function is doing.`},{id:`q6_b`,letter:`B`,label:`Protecting strength and staying capable in daily life.`,insight:`Resistance training and adequate protein are the strongest practical priorities for that goal.`},{id:`q6_c`,letter:`C`,label:`Making my appetite even smaller.`,insight:`Lower food intake can make protein, fluids and micronutrients harder to get.`},{id:`q6_d`,letter:`D`,label:`Focusing mainly on appearance and skin changes.`,insight:`Appearance matters, but strength and function provide useful information that the mirror cannot.`}]},q7:{id:`q7`,type:`question`,topic:`Recovery needs`,prompt:`Which change would help your day feel more manageable?`,hint:`Choose the answer that best reflects your current priority.`,options:[{id:`q7_a`,letter:`A`,label:`Less soreness and stiffness after everyday activity.`,insight:`We will add recovery and activity comfort notes to your summary.`},{id:`q7_b`,letter:`B`,label:`Better sleep and an easier wind down at night.`,insight:`We will add sleep and evening routine patterns to your summary.`},{id:`q7_c`,letter:`C`,label:`Fewer energy dips in the afternoon.`,insight:`We will add energy timing, meals and fluids to your summary.`},{id:`q7_d`,letter:`D`,label:`Clearer thinking and steadier energy through the day.`,insight:`We will add energy, nutrition, sleep and recovery patterns to your summary.`}]},q8:{id:`q8`,type:`question`,topic:`Digestive priority`,prompt:`What would better digestive comfort make easier for you?`,hint:`Choose a benefit, or tell us this is not a concern.`,options:[{id:`q8_none`,letter:`A`,label:`Digestive comfort is not a concern for me.`,insight:`We will focus on the priorities you selected.`},{id:`q8_a`,letter:`B`,label:`Eating comfortable portions and meeting nutrition needs more consistently.`,insight:`Meal size, timing, fluids and symptom notes can support a better conversation with your clinician.`},{id:`q8_b`,letter:`C`,label:`Planning meals with less worry about symptoms.`,insight:`We will add meal planning and symptom timing notes to your summary.`},{id:`q8_c`,letter:`D`,label:`Feeling more comfortable being active after meals.`,insight:`We will add post-meal comfort and activity notes to your summary.`},{id:`q8_d`,letter:`E`,label:`Enjoying meals away from home with more confidence.`,insight:`We will add eating-out comfort and preparation notes to your summary.`}]}},Qn={A:{id:`stop_a`,type:`stop_block`,block:`A`,eyebrow:`Strength and lean tissue`,title:`Make strength visible in your plan`,cta:`Add strength to my summary`,paragraphs:()=>[`Weight loss can include lean tissue as well as body fat. Lean mass includes water, organs, connective tissue and skeletal muscle, so it should not be read as muscle alone.`,`Tracking strength, protein intake and resistance activity can make this part of continuity planning more useful.`,`Your quiz summary can help you organize the questions and records to bring to your current clinician. Peptis is not providing medical services through this check today.`]},B:{id:`stop_b`,type:`stop_block`,block:`B`,eyebrow:`Energy and recovery`,title:`Give fatigue the context it deserves`,cta:`Add energy
